name: Sync to Greasy Fork

on:
  push:
    branches: [main]
    paths:
      - douyin-danmaku-performance.user.js
      - .github/workflows/greasyfork-sync.yml
      - tools/greasyfork-sync.mjs
      - tests/greasyfork-sync.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greasyfork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'KNaiFen/douyin-danmaku-performance' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Test webhook delivery
        run: node --test tests/greasyfork-sync.test.mjs
      - name: Notify Greasy Fork
        env:
          GREASYFORK_WEBHOOK_SECRET: ${{ secrets.GREASYFORK_WEBHOOK_SECRET }}
        run: node tools/greasyfork-sync.mjs
